{% extends 'base.html' %}
{% block title %}Add Fee{% endblock %}
{% block content %}

<div class="page-header">
    <h2>Add Fee Record</h2>
</div>

<div class="content-card" style="max-width:500px;">
    <form method="POST">
        {% csrf_token %}

        <label>Student</label>
        <select name="student" class="form-control-VidyaTrack" required>
            {% for s in students %}
            <option value="{{ s.id }}">{{ s.name }} ({{ s.roll_number }})</option>
            {% endfor %}
        </select>

        <label>Fee Type</label>
        <input type="text" name="fee_type" class="form-control-VidyaTrack" placeholder="e.g. Tuition Fee" required>

        <label>Amount (₹)</label>
        <input type="number" step="0.01" name="amount" class="form-control-VidyaTrack" required>

        <label>Due Date</label>
        <input type="date" name="due_date" class="form-control-VidyaTrack" required>

        <button type="submit" class="btn-VidyaTrack" style="margin-top:15px;">Save Fee Record</button>
        <a href="{% url 'fee_list' %}" class="btn-VidyaTrack" style="background:#e0e0e0; color:#333;">Cancel</a>
    </form>
</div>
{% endblock %}
