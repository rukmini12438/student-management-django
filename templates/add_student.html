{% extends 'base.html' %}
{% load static %}
{% block title %}Add Student{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Add Student</h2>
    <p>Enter complete student details below</p>
</div>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- Basic Info -->
    <div class="content-card mb-4">
        <h5 class="section-title">Basic Info</h5>

        <div class="form-row">
            <div>
                <label class="form-label">Full Name *</label>
                <input type="text" name="name" class="form-control-VidyaTrack" required>
            </div>
            <div>
                <label class="form-label">Roll Number *</label>
                <input type="text" name="roll_number" class="form-control-VidyaTrack" required>
            </div>
        </div>

        <div class="form-row">
            <div>
                <label class="form-label">Date of Birth</label>
                <input type="date" name="date_of_birth" class="form-control-VidyaTrack">
            </div>
            <div>
                <label class="form-label">Gender</label>
                <select name="gender" class="form-control-VidyaTrack">
                    <option value="">-- Select --</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div>
                <label class="form-label">Blood Group</label>
                <select name="blood_group" class="form-control-VidyaTrack">
                    <option value="">-- Select --</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>
        </div>

        <label class="form-label">Photo</label>
        <input type="file" name="photo" class="form-control-VidyaTrack" accept="image/*">
    </div>

    <!-- Academic Info -->
    <div class="content-card mb-4">
        <h5 class="section-title">Academic Info</h5>

        <div class="form-row">
            <div>
                <label class="form-label">Course *</label>
                <input type="text" name="course" class="form-control-VidyaTrack" placeholder="e.g. B.Tech CSE" required>
            </div>
            <div>
                <label class="form-label">Department</label>
                <select name="department" class="form-control-VidyaTrack">
                    <option value="">-- Select --</option>
                    {% for dept in departments %}
                    <option value="{{ dept.id }}">{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div>
                <label class="form-label">Admission Date</label>
                <input type="date" name="admission_date" class="form-control-VidyaTrack">
            </div>
            <div>
                <label class="form-label">Age *</label>
                <input type="number" name="age" class="form-control-VidyaTrack" required>
            </div>
        </div>
    </div>

    <!-- Contact Info -->
    <div class="content-card mb-4">
        <h5 class="section-title">Contact Info</h5>

        <div class="form-row">
            <div>
                <label class="form-label">Email *</label>
                <input type="email" name="email" class="form-control-VidyaTrack" required>
            </div>
            <div>
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone_number" class="form-control-VidyaTrack">
            </div>
        </div>

        <label class="form-label">Address</label>
        <textarea name="address" class="form-control-VidyaTrack" rows="2"></textarea>

        <div class="form-row">
            <div>
                <label class="form-label">City</label>
                <input type="text" name="city" class="form-control-VidyaTrack">
            </div>
            <div>
                <label class="form-label">State</label>
                <input type="text" name="state" class="form-control-VidyaTrack">
            </div>
            <div>
                <label class="form-label">Pincode</label>
                <input type="text" name="pincode" class="form-control-VidyaTrack">
            </div>
        </div>
    </div>

    <!-- Father's Details -->
    <div class="content-card mb-4">
        <h5 class="section-title">Father's Details</h5>
        <div class="form-row">
            <div>
                <label class="form-label">Name</label>
                <input type="text" name="father_name" class="form-control-VidyaTrack">
            </div>
            <div>
                <label class="form-label">Occupation</label>
                <input type="text" name="father_occupation" class="form-control-VidyaTrack">
            </div>
            <div>
                <label class="form-label">Phone</label>
                <input type="text" name="father_phone" class="form-control-VidyaTrack">
            </div>
        </div>
    </div>

    <!-- Mother's Details -->
    <div class="content-card mb-4">
        <h5 class="section-title">Mother's Details</h5>
        <div class="form-row">
            <div>
                <label class="form-label">Name</label>
                <input type="text" name="mother_name" class="form-control-VidyaTrack">
            </div>
            <div>
                <label class="form-label">Occupation</label>
                <input type="text" name="mother_occupation" class="form-control-VidyaTrack">
            </div>
            <div>
                <label class="form-label">Phone</label>
                <input type="text" name="mother_phone" class="form-control-VidyaTrack">
            </div>
        </div>
    </div>

    <!-- Guardian Details (collapsible) -->
    <div class="content-card mb-4">
        <h5 class="section-title" onclick="toggleGuardian()" style="cursor:pointer;">
            Guardian Details <i class="fa-solid fa-chevron-down" id="guardianArrow"></i>
        </h5>
        <div id="guardianFields" style="display:none;">
            <div class="form-row">
                <div>
                    <label class="form-label">Name</label>
                    <input type="text" name="guardian_name" class="form-control-VidyaTrack">
                </div>
                <div>
                    <label class="form-label">Relation</label>
                    <input type="text" name="guardian_relation" class="form-control-VidyaTrack">
                </div>
                <div>
                    <label class="form-label">Phone</label>
                    <input type="text" name="guardian_phone" class="form-control-VidyaTrack">
                </div>
            </div>
        </div>
    </div>

    <button type="submit" class="btn-VidyaTrack">
        <i class="fa-solid fa-check"></i> Save Student
    </button>
    <a href="{% url 'student_list' %}" class="btn-VidyaTrack" style="background:#e0e0e0; color:#333; margin-left:10px;">
        Cancel
    </a>
</form>

<script>
function toggleGuardian() {
    const fields = document.getElementById('guardianFields');
    const arrow = document.getElementById('guardianArrow');
    if (fields.style.display === 'none') {
        fields.style.display = 'block';
        arrow.style.transform = 'rotate(180deg)';
    } else {
        fields.style.display = 'none';
        arrow.style.transform = 'rotate(0deg)';
    }
}
</script>
{% endblock %}
