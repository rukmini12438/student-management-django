{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}

<div class="content-card" style="max-width:400px; margin:40px auto;">
    <h3>Create Account</h3>

    {% if messages %}
        {% for message in messages %}
            <p style="color:green;">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-VidyaTrack">Register</button>
    </form>

    <p style="margin-top:15px;">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
</div>

{% endblock %}
