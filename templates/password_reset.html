{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="content-card" style="max-width:400px; margin:40px auto;">
    <h3>Reset your password</h3>
    <p>Enter your email and we'll send you a link to reset your password.</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-VidyaTrack">Send Reset Link</button>
    </form>
    <p style="margin-top:15px;"><a href="{% url 'login' %}">Back to login</a></p>
</div>
{% endblock %}
