{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="content-card" style="max-width:400px; margin:40px auto;">
    <h3>Login to VidyaTrack</h3>

    {% if form.errors %}
        <p style="color:red;">Invalid username or password.</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-VidyaTrack">Login</button>
    </form>

    <p style="margin-top:15px;">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
    <p style="margin-top:10px;"><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
</div>

{% endblock %}
