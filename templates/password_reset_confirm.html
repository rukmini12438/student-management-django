{% extends "base.html" %}
{% block title %}Set new password{% endblock %}
{% block content %}
<div class="content-card" style="max-width:400px; margin:40px auto;">
    <h3>Set a new password</h3>
    {% if validlink %}
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-VidyaTrack">Reset Password</button>
        </form>
    {% else %}
        <p>This password reset link is invalid or has expired.</p>
        <a href="{% url 'password_reset' %}">Request a new one</a>
    {% endif %}
</div>
{% endblock %}
